services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vtuberthai
      POSTGRES_USER: vtuber
      POSTGRES_PASSWORD: vtuberpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://vtuber:vtuberpass@db:5432/vtuberthai
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
    depends_on:
      - db
      - redis

  celery:
    build: ./backend
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgres://vtuber:vtuberpass@db:5432/vtuberthai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis

  celery-beat:
    build: ./backend
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgres://vtuber:vtuberpass@db:5432/vtuberthai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1

volumes:
  postgres_data:
